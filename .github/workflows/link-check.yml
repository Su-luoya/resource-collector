name: Link check

on:
  schedule:
    - cron: '0 3 * * 1' # 每周一 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: write # 周检结束后触发一次重建

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync
      - name: Probe links and write results
        id: probe
        run: node scripts/check-links.mjs
      - name: Trigger rebuild so new statuses show up
        if: ${{ !cancelled() && steps.probe.outputs.rebuild == 'true' }}
        run: gh workflow run deploy.yml --ref master
